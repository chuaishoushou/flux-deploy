<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>通知邮件</title>

  <!-- Quill Snow 主题样式（由 Java 端 inline 注入） -->
  <style>{{QUILL_CSS}}</style>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
    body {
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    /* 顶部工具栏 + 编辑区 用 flex 撑满整个 viewport */
    #editor-wrap { display: flex; flex-direction: column; height: 100vh; }
    .ql-toolbar.ql-snow {
      flex: 0 0 auto;
      border-left: none;
      border-right: none;
      border-top: none;
    }
    .ql-container.ql-snow {
      flex: 1 1 auto;
      overflow: auto;
      border: none;
      font-size: 14px;
      font-family: inherit;
    }
    .ql-editor { padding: 14px 18px; min-height: 100%; }

    /* ========= 占位符 chip ========= */
    /* chip 视觉标记：橙色虚线下划线，告诉用户"这里是变量插值，不是模板正文"。
       复制到剪贴板时 chip 脱壳保留内部值，外面的样式（包括这条虚线）都会被丢掉，
       粘到企业微信邮箱看不到任何额外装饰。 */
    .ph {
      display: inline-block;
      vertical-align: top;
      max-width: 100%;
      border-bottom: 1px dashed rgba(176, 119, 0, 0.55);
    }
    /* 空 chip（值未填）：暖灰斜体 + 还是那条虚线 */
    .ph.ph-empty {
      color: #b07700;
      font-style: italic;
    }

    /* ========= 工具栏字号下拉显示文字（whitelist 是 px 值，工具栏标签显示同样的值） ========= */
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value]::before {
      content: attr(data-value);
    }
    /* 字号下拉默认显示 "Size" 太占位 */
    .ql-snow .ql-picker.ql-size .ql-picker-label:not([data-value])::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item:not([data-value])::before {
      content: '默认';
    }

    /* ========= 工具栏字体下拉：中文 label + 各选项用对应字体渲染 ========= */
    /* 默认下拉项 / 未选中态：显示"默认" */
    .ql-snow .ql-picker.ql-font .ql-picker-label:not([data-value])::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item:not([data-value])::before {
      content: '默认';
    }
    .ql-snow .ql-picker.ql-font [data-value="Microsoft YaHei"]::before    { content: '微软雅黑'; font-family: "Microsoft YaHei", sans-serif; }
    .ql-snow .ql-picker.ql-font [data-value="SimSun"]::before             { content: '宋体';     font-family: SimSun, serif; }
    .ql-snow .ql-picker.ql-font [data-value="SimHei"]::before             { content: '黑体';     font-family: SimHei, sans-serif; }
    .ql-snow .ql-picker.ql-font [data-value="KaiTi"]::before              { content: '楷体';     font-family: KaiTi, serif; }
    .ql-snow .ql-picker.ql-font [data-value="PingFang SC"]::before        { content: '苹方';     font-family: "PingFang SC", sans-serif; }
    .ql-snow .ql-picker.ql-font [data-value="Arial"]::before              { content: 'Arial';   font-family: Arial, sans-serif; }
    .ql-snow .ql-picker.ql-font [data-value="Times New Roman"]::before    { content: 'Times';   font-family: "Times New Roman", serif; }
    .ql-snow .ql-picker.ql-font [data-value="Courier New"]::before        { content: 'Courier'; font-family: "Courier New", monospace; }

    /* ========= 工具栏「变量」picker 下拉：label 始终显示"变量"，选项显示字段名 ========= */
    .ql-snow .ql-picker.ql-flux-var { width: 70px; }
    .ql-snow .ql-picker.ql-flux-var .ql-picker-label::before { content: '变量'; }
    .ql-snow .ql-picker.ql-flux-var .ql-picker-item::before  { content: attr(data-value); }
  </style>
</head>
<body>
<div id="editor-wrap">
  <div id="editor"></div>
</div>

<!-- Quill 2 主体（由 Java 端 inline 注入） -->
<script>{{QUILL_JS}}</script>

<script>
  (function () {
    // ============================================================
    //   1. 注册自定义字体白名单（style 形态：直接写 inline font-family，
    //      复制到企业微信邮箱后样式能保留——class 形态的 .ql-font-X
    //      在企微邮箱里失效）
    // ============================================================
    const Font = Quill.import('attributors/style/font');
    Font.whitelist = [
      'Microsoft YaHei', 'SimSun', 'SimHei', 'KaiTi', 'PingFang SC',
      'Arial', 'Times New Roman', 'Courier New'
    ];
    Quill.register(Font, true);

    // ============================================================
    //   2. 注册自定义字号白名单（style 形态，直接写 inline font-size）
    // ============================================================
    const Size = Quill.import('attributors/style/size');
    Size.whitelist = ['10px', '11px', '12px', '13px', '14px',
                      '16px', '18px', '20px', '24px', '28px', '32px'];
    Quill.register(Size, true);

    // ============================================================
    //   2.5 把 align 也切到 style 形态（class 形态的 .ql-align-X 在企微邮箱里失效）
    // ============================================================
    const Align = Quill.import('attributors/style/align');
    Align.whitelist = ['right', 'center', 'justify'];
    Quill.register(Align, true);

    // ============================================================
    //   3. 注册 FluxField Embed Blot（占位符 chip）
    //
    //   Quill 2 / Parchment 3 的 Blot 是 ES6 class，必须用 ES6 class 语法继承，
    //   否则 super.create() 的静态方法链会断，导致 chip 渲染失败，整条 Delta
    //   被 Quill 静默丢弃（表现为模板从首个 chip 起后面内容全部消失）。
    //
    //   - blotName : flux-field
    //   - tagName  : SPAN
    //   - className: ph
    //   - 不可编辑（contenteditable=false）—— Quill Embed atomic 节点默认行为
    //   - 鼠标可选中复制（CSS 不设 user-select: none）
    // ============================================================
    const Embed = Quill.import('blots/embed');

    class FluxField extends Embed {
      static create(value) {
        const node = super.create(value);
        const key = (value && value.key) || '';
        const empty = !!(value && value.empty);
        const raw = !!(value && value.raw);
        const content = (value && value.value != null) ? value.value : '';
        node.setAttribute('data-key', key);
        node.setAttribute('contenteditable', 'false');
        if (empty) {
          node.classList.add('ph-empty');
          node.innerHTML = '${' + key + '}';
        } else if (raw) {
          node.innerHTML = String(content);
        } else {
          node.textContent = String(content);
        }
        return node;
      }

      static value(node) {
        return {
          key: node.getAttribute('data-key') || '',
          empty: node.classList.contains('ph-empty'),
          value: node.innerHTML,
          raw: true
        };
      }
    }

    FluxField.blotName = 'flux-field';
    FluxField.tagName = 'SPAN';
    FluxField.className = 'ph';

    Quill.register(FluxField);

    // ============================================================
    //   4. 哪些字段值是 raw HTML 片段（不 escape，让 <br> 之类的生效）
    // ============================================================
    var RAW_HTML_KEYS = { '更新包': true, '备份包': true };

    // ============================================================
    //   4.5 当前已知的字段值字典 —— 由 setTemplate / updateChips 同步维护
    //
    //   工具栏「变量」下拉点选插入 chip 时，用此字典决定新 chip 的初始内容：
    //   - 字段已有值 → 渲染为正常 chip 显示该值
    //   - 字段未有值 → 渲染为 ph-empty 灰字斜体显示 ${字段名}
    // ============================================================
    var currentValues = {};

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function cssEscape(s) {
      if (window.CSS && CSS.escape) return CSS.escape(s);
      return String(s).replace(/["\\]/g, '\\$&');
    }

    // ============================================================
    //   5. 初始化 Quill 实例（Snow 主题 + 工具栏）
    // ============================================================
    var quill = new Quill('#editor', {
      theme: 'snow',
      placeholder: '在此处编辑邮件正文……',
      modules: {
        toolbar: {
          container: [
            [{ 'font': Font.whitelist }],
            [{ 'size': Size.whitelist }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'color': [] }, { 'background': [] }],
            [{ 'align': [] }],
            [{ 'list': 'ordered' }, { 'list': 'bullet' }],
            [{ 'indent': '-1' }, { 'indent': '+1' }],
            ['link'],
            ['clean'],
            [{ 'flux-var': ['项目', '任务', '客服', '更新包', '备份包'] }]
          ],
          handlers: {
            // 「变量」picker —— 在当前光标位置插入 FluxField chip
            //
            // 交互：
            //   - currentValues 里有该 key 的值 → chip 立即显示该值
            //   - 没有 → chip 显示 ph-empty 灰字斜体 ${字段名}
            //
            // 必须在 modules.toolbar.handlers 里配置，不能事后 addHandler：
            // Quill 在 Toolbar 构造时 attach picker 会检查"handler / 已注册 format"
            // 二者存在其一，缺一直接 ignore 这个 picker（attach() 内的
            // "ignoring attaching to nonexistent format" 警告），事后再
            // addHandler 不会重新 attach、change 事件永远不会触发。
            //
            // picker 选中后 Quill 默认把 label 停在该值上，连续点同一项会因为
            // value 未变而失效，需要主动重置 label / 清掉 item 的 selected 态。
            'flux-var': function (key) {
              if (!key) return;
              var range = quill.getSelection(true);
              if (!range) return;
              var raw = currentValues[key];
              var empty = (raw === undefined || raw === null || raw === '');
              var content = empty ? '' : (RAW_HTML_KEYS[key] ? String(raw) : escapeHtml(raw));
              quill.insertEmbed(range.index, 'flux-field', {
                key: key,
                empty: empty,
                value: content,
                raw: true
              }, Quill.sources.USER);
              quill.setSelection(range.index + 1, Quill.sources.SILENT);
              setTimeout(function () {
                var pickerLabel = document.querySelector('.ql-flux-var .ql-picker-label');
                if (pickerLabel) {
                  pickerLabel.classList.remove('ql-active');
                  pickerLabel.removeAttribute('data-value');
                }
                var items = document.querySelectorAll('.ql-flux-var .ql-picker-item');
                items.forEach(function (it) { it.classList.remove('ql-selected'); });
              }, 0);
            }
          }
        }
      }
    });

    // ============================================================
    //   6. clipboard.matcher —— 让 convert({html}) 把 <span class="ph"> 转成 FluxField embed
    //   触发：setTemplate 用 clipboard.convert 把模板 HTML 解析成 Delta 时走这里
    // ============================================================
    var Delta = Quill.import('delta');
    quill.clipboard.addMatcher('span.ph', function (node) {
      return new Delta().insert({
        'flux-field': {
          key: node.getAttribute('data-key') || '',
          empty: node.classList.contains('ph-empty'),
          value: node.innerHTML,
          raw: true
        }
      });
    });

    // ============================================================
    //   7. 模板 HTML + 字段值字典 → 灌进编辑器
    //
    //   流程：
    //   a) ${字段} 替换为 <span class="ph" data-key=...>...</span> 字面（含 chip 内容）
    //   b) clipboard.convert 把上面 HTML 解析成 Delta（chip 走 matcher → flux-field embed）
    //   c) quill.setContents(delta) 灌入
    // ============================================================
    function loadTemplate(templateHtml, values) {
      values = values || {};
      // 用本次注入的 values 整体覆盖 currentValues，保证工具栏「变量」下拉
      // 插入新 chip 时取到的是当前模板的字段快照、不会沾染上一份模板的残留值
      currentValues = {};
      Object.keys(values).forEach(function (k) { currentValues[k] = values[k]; });
      var rendered = (templateHtml || '').replace(
        /\$\{([^}\s]+)\}/g,
        function (_, key) {
          var raw = values[key];
          var empty = (raw === undefined || raw === null || raw === '');
          var cls = empty ? 'ph ph-empty' : 'ph';
          var safeKey = escapeHtml(key);
          var content;
          if (empty) {
            content = '${' + safeKey + '}';
          } else if (RAW_HTML_KEYS[key]) {
            content = String(raw);
          } else {
            content = escapeHtml(raw);
          }
          return '<span class="' + cls + '" data-key="' + safeKey
            + '" contenteditable="false">' + content + '</span>';
        }
      );
      var delta = quill.clipboard.convert({ html: rendered });
      quill.setContents(delta, 'silent');
      quill.focus();
    }

    // ============================================================
    //   8. 反向序列化 —— chip → ${key} 文本，写入模板源文件用
    // ============================================================
    function serializeTemplate() {
      var clone = quill.root.cloneNode(true);
      // 把 chip 替换成 ${key} 文本节点
      var chips = clone.querySelectorAll('.ph');
      chips.forEach(function (chip) {
        var key = chip.getAttribute('data-key') || '';
        var textNode = document.createTextNode('${' + key + '}');
        chip.parentNode.replaceChild(textNode, chip);
      });
      // Quill 在末尾常加一个空 <p><br></p>，正常保留即可（不影响渲染）
      return clone.innerHTML;
    }

    // ============================================================
    //   9. 渲染序列化 —— chip 脱壳保留内部值，复制到剪贴板用
    //
    //   额外做两件事，让粘到企业微信邮箱时段落间距 / 字体跟编辑器内一致：
    //   a) 给所有块级元素加 inline style="margin:0"，覆盖企微邮箱
    //      contenteditable 默认 <p> 的 1em margin（否则段距会撑得很大）。
    //      ol/ul 的 padding-left 不动 —— 那是列表 bullet 缩进，动了会贴边。
    //   b) 外层包一个 <div> 兜底容器，把没显式选字体/字号的文本
    //      统一继承到 微软雅黑 / 14px / line-height 1.5 / #222，
    //      跟编辑器内 .ql-editor 默认观感对齐。
    //
    //   注意：必须在 chip 脱壳之后再做 style 注入，否则 chip 内部的
    //   <p>（更新包 / 备份包 raw HTML 多行值）会被漏掉。
    // ============================================================
    var BLOCK_SELECTOR =
        'p, ol, ul, li, h1, h2, h3, h4, h5, h6, blockquote';
    var FALLBACK_CONTAINER_STYLE =
        'font-family: "Microsoft YaHei", sans-serif;'
        + ' font-size: 14px;'
        + ' line-height: 1.5;'
        + ' color: #222;';

    function serializeRendered() {
      var clone = quill.root.cloneNode(true);
      var chips = clone.querySelectorAll('.ph');
      chips.forEach(function (chip) {
        var empty = chip.classList.contains('ph-empty');
        if (empty) {
          // 空 chip：直接去掉，避免 ${任务} 字面值被发出去
          chip.outerHTML = '';
        } else {
          chip.outerHTML = chip.innerHTML;
        }
      });
      // chip 脱壳之后再压块级 margin，保证 raw HTML 值里的 <p> 也覆盖到
      var blocks = clone.querySelectorAll(BLOCK_SELECTOR);
      blocks.forEach(function (el) {
        el.style.margin = '0';
      });
      return '<div style="' + FALLBACK_CONTAINER_STYLE + '">'
          + clone.innerHTML + '</div>';
    }

    // ============================================================
    //   10. In-place 更新 chip 显示值（导入按钮用）
    //   直接改 DOM 的 chip.innerHTML —— Embed Blot 是 contenteditable=false，
    //   Quill 的 mutation observer 不会修改 atomic embed 的内部内容。
    // ============================================================
    function updateChipValue(key, value) {
      var chips = quill.root.querySelectorAll(
          '.ph[data-key="' + cssEscape(key) + '"]');
      chips.forEach(function (chip) {
        var empty = (value === undefined || value === null || value === '');
        if (empty) {
          chip.classList.add('ph-empty');
          chip.innerHTML = '${' + escapeHtml(key) + '}';
        } else {
          chip.classList.remove('ph-empty');
          chip.innerHTML = RAW_HTML_KEYS[key]
              ? String(value)
              : escapeHtml(value);
        }
      });
    }

    // ============================================================
    //   11. JS ↔ Java 桥
    // ============================================================
    function sendToJava(payload) {
      if (typeof window.fluxBridge !== 'function') return;
      try {
        window.fluxBridge(JSON.stringify(payload),
            function () {}, function () {});
      } catch (e) { /* ignore */ }
    }

    window.__fluxEmail = {
      // Java → JS：注入初始模板 + 字段值
      setTemplate: function (templateHtml, values) {
        try {
          loadTemplate(templateHtml, values);
        } catch (err) {
          console.error('[FluxEmail] setTemplate failed:', err);
        }
      },
      // Java → JS：导入按钮回调，in-place 改 chip 显示值
      updateChips: function (values) {
        if (!values) return;
        try {
          Object.keys(values).forEach(function (k) {
            // 同步缓存，让工具栏「变量」下拉之后新插的 chip 也能取到最新值
            currentValues[k] = values[k];
            updateChipValue(k, values[k]);
          });
        } catch (err) {
          console.error('[FluxEmail] updateChips failed:', err);
        }
      },
      // Java → JS：请求当前编辑器的"模板形态"（chip → ${key}）
      requestTemplateSource: function (reqId) {
        try {
          sendToJava({ kind: 'template', id: reqId, body: serializeTemplate() });
        } catch (err) {
          console.error('[FluxEmail] requestTemplateSource failed:', err);
          sendToJava({ kind: 'template', id: reqId, body: '', error: String(err) });
        }
      },
      // Java → JS：请求当前编辑器的"渲染形态"（chip 脱壳）
      requestRenderedHtml: function (reqId) {
        try {
          sendToJava({ kind: 'rendered', id: reqId, body: serializeRendered() });
        } catch (err) {
          console.error('[FluxEmail] requestRenderedHtml failed:', err);
          sendToJava({ kind: 'rendered', id: reqId, body: '', error: String(err) });
        }
      }
    };

    function notifyReady() {
      if (typeof window.fluxBridge !== 'function') {
        setTimeout(notifyReady, 20);
        return;
      }
      sendToJava({ kind: 'ready' });
    }
    notifyReady();

    // ============================================================
    //   12. JCEF 拖动选择修复 —— 鼠标按下时给 .ql-editor 抓 pointer capture
    //
    //   JCEF embedded 场景下，鼠标在编辑器内 mousedown 后拖到 JCEF 边界之外，
    //   Swing 不再向 native CEF 转发 mouseMoved 事件 → 选择中断（用户报告
    //   "鼠标移出弹窗外侧文本就无法继续选择"）。
    //
    //   setPointerCapture 让 Chromium 在 native 层捕获 pointer，即使鼠标移出
    //   element 边界仍持续接收 pointer event，bypass JCEF wrapper 的 mouse forwarding 限制。
    //
    //   在 .ql-editor 上挂全局监听器，捕获阶段（true）拦截，确保在 Quill 自己的
    //   handler 之前生效。
    // ============================================================
    document.addEventListener('pointerdown', function (ev) {
      var editor = document.querySelector('.ql-editor');
      if (!editor) return;
      if (!editor.contains(ev.target) && ev.target !== editor) return;
      try {
        editor.setPointerCapture(ev.pointerId);
      } catch (err) { /* 浏览器不支持 / pointerId 无效，安静忽略 */ }
    }, true);
  })();
</script>
</body>
</html>
